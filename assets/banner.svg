<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#1b263b"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#a18cd1"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulseStrand{0%{stroke-opacity:.25;transform:scale(1)}50%{stroke-opacity:.65;transform:scale(1.02)}}@keyframes pulseNode{0%{r:4px;opacity:.4}50%{r:6.5px;opacity:.9}}@keyframes flowAlong{0%{stroke-dashoffset:600}}.dna-strand{animation:pulseStrand 8s ease-in-out infinite alternate}.node-pulse{animation:pulseNode 3s ease-in-out infinite}.flow-particle{animation:flowAlong 12s linear infinite}.banner-pill,.banner-sub,.banner-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,&apos;Roboto&apos;,&apos;Helvetica Neue&apos;,Arial,sans-serif}.banner-title{font-weight:800;letter-spacing:-.5px}.banner-sub{font-weight:400}.banner-pill{font-weight:600;font-size:11px;letter-spacing:.5px}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g class="dna-strand"><path fill="none" stroke="#00f2fe" stroke-dasharray="8 6" stroke-width="2.5" d="M -50,280 C 250,340 450,180 750,260 C 950,310 1100,200 1250,240" opacity=".3" transform="translate(0, 0)"/><path fill="none" stroke="#a18cd1" stroke-dasharray="12 8" stroke-width="2" d="M -50,300 C 220,200 500,320 800,220 C 1000,160 1150,290 1250,210" opacity=".3" transform="translate(0, 0)"/><path fill="none" stroke="#4facfe" stroke-dasharray="10 6" stroke-dashoffset="600" stroke-width="2" d="M -50,120 C 200,60 400,200 700,100 C 900,40 1100,160 1250,90" class="flow-particle" opacity=".25" transform="translate(0, 0)"/></g><g opacity=".5"><line x1="880" x2="980" y1="90" y2="130" stroke="rgba(79, 172, 254, 0.4)" stroke-width="1.5"/><line x1="980" x2="1100" y1="130" y2="80" stroke="rgba(79, 172, 254, 0.4)" stroke-width="1.5"/><line x1="980" x2="1050" y1="130" y2="220" stroke="rgba(161, 140, 209, 0.4)" stroke-width="1.5"/><line x1="1050" x2="1140" y1="220" y2="200" stroke="rgba(161, 140, 209, 0.4)" stroke-width="1.5"/><line x1="920" x2="1050" y1="240" y2="220" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/><circle cx="880" cy="90" r="5" fill="#00f2fe" class="node-pulse"/><circle cx="980" cy="130" r="6" fill="#4facfe" class="node-pulse" style="animation-delay:.6s"/><circle cx="1100" cy="80" r="4.5" fill="#38ef7d" class="node-pulse" style="animation-delay:1.2s"/><circle cx="1050" cy="220" r="6" fill="#a18cd1" class="node-pulse" style="animation-delay:1.8s"/><circle cx="1140" cy="200" r="4" fill="#00f2fe" class="node-pulse" style="animation-delay:2.4s"/><circle cx="920" cy="240" r="5" fill="#10b981" class="node-pulse" style="animation-delay:.9s"/></g><circle cx="420" cy="170" r="140" fill="#00f2fe" filter="url(#glow)" opacity=".08"/><circle cx="800" cy="180" r="160" fill="#a18cd1" filter="url(#glow)" opacity=".06"/><g transform="translate(80, 52)"><rect width="270" height="28" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="5" fill="#10b981" filter="url(#subtleGlow)"/><text x="30" y="18" fill="#e2e8f0" class="banner-pill">CURATED ECOSYSTEM • 2026 EDITION</text></g><g><text x="0" y="0" fill="url(#accentGrad)" class="banner-title" filter="url(#subtleGlow)" font-size="44" transform="translate(80, 140)">Awesome Biomedical Research Platforms</text><text x="0" y="44" fill="#f1f5f9" class="banner-sub" font-size="20" opacity=".95" transform="translate(80, 140)">Reproducible Genomic Workflows, Cloud Bioinformatics SaaS &amp; Open-Source Pipelines</text><text x="0" y="76" fill="#94a3b8" class="banner-sub" font-size="14.5" transform="translate(80, 140)">Multi-Omics Orchestration • Next-Gen Sequencing (NGS) • Clinical Data Management • GA4GH Standards</text></g><g><g transform="translate(80, 275) translate(0, 0)"><rect width="180" height="34" fill="rgba(15, 23, 42, 0.85)" stroke="#00f2fe" stroke-width="1.2" rx="8"/><text x="16" y="21" fill="#38bdf8" class="banner-pill">⚡ CLOUD BIOINFORMATICS</text></g><g transform="translate(80, 275) translate(195, 0)"><rect width="195" height="34" fill="rgba(15, 23, 42, 0.85)" stroke="#a18cd1" stroke-width="1.2" rx="8"/><text x="16" y="21" fill="#c084fc" class="banner-pill">🧬 WORKFLOW ORCHESTRATION</text></g><g transform="translate(80, 275) translate(405, 0)"><rect width="185" height="34" fill="rgba(15, 23, 42, 0.85)" stroke="#10b981" stroke-width="1.2" rx="8"/><text x="16" y="21" fill="#34d399" class="banner-pill">🔬 CLINICAL GENOMICS</text></g><g transform="translate(80, 275) translate(605, 0)"><rect width="165" height="34" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.2" rx="8"/><text x="16" y="21" fill="#fbbf24" class="banner-pill">🔗 OPEN STANDARDS</text></g></g></svg>