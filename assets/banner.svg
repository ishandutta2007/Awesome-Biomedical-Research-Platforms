<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a18cd1" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .dna-strand {
        animation: pulseStrand 8s ease-in-out infinite alternate;
      }
      @keyframes pulseStrand {
        0% { stroke-opacity: 0.25; transform: scale(1); }
        50% { stroke-opacity: 0.65; transform: scale(1.02); }
        100% { stroke-opacity: 0.25; transform: scale(1); }
      }
      .node-pulse {
        animation: pulseNode 3s ease-in-out infinite;
      }
      @keyframes pulseNode {
        0%, 100% { r: 4px; opacity: 0.4; }
        50% { r: 6.5px; opacity: 0.9; }
      }
      .flow-particle {
        animation: flowAlong 12s linear infinite;
      }
      @keyframes flowAlong {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .banner-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
      }
      .banner-pill {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Abstract Background Elements (Backdrop) -->
  <g class="dna-strand" transform="translate(0, 0)">
    <!-- Curving multi-omics data waves -->
    <path d="M -50,280 C 250,340 450,180 750,260 C 950,310 1100,200 1250,240" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.3" stroke-dasharray="8 6" />
    <path d="M -50,300 C 220,200 500,320 800,220 C 1000,160 1150,290 1250,210" fill="none" stroke="#a18cd1" stroke-width="2" opacity="0.3" stroke-dasharray="12 8" />
    <path d="M -50,120 C 200,60 400,200 700,100 C 900,40 1100,160 1250,90" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.25" stroke-dasharray="10 6" class="flow-particle" stroke-dashoffset="600" />
  </g>

  <!-- Flowing Network Nodes (Background) -->
  <g opacity="0.5">
    <line x1="880" y1="90" x2="980" y2="130" stroke="rgba(79, 172, 254, 0.4)" stroke-width="1.5" />
    <line x1="980" y1="130" x2="1100" y2="80" stroke="rgba(79, 172, 254, 0.4)" stroke-width="1.5" />
    <line x1="980" y1="130" x2="1050" y2="220" stroke="rgba(161, 140, 209, 0.4)" stroke-width="1.5" />
    <line x1="1050" y1="220" x2="1140" y2="200" stroke="rgba(161, 140, 209, 0.4)" stroke-width="1.5" />
    <line x1="920" y1="240" x2="1050" y2="220" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />

    <circle cx="880" cy="90" r="5" fill="#00f2fe" class="node-pulse" />
    <circle cx="980" cy="130" r="6" fill="#4facfe" class="node-pulse" style="animation-delay: 0.6s;" />
    <circle cx="1100" cy="80" r="4.5" fill="#38ef7d" class="node-pulse" style="animation-delay: 1.2s;" />
    <circle cx="1050" cy="220" r="6" fill="#a18cd1" class="node-pulse" style="animation-delay: 1.8s;" />
    <circle cx="1140" cy="200" r="4" fill="#00f2fe" class="node-pulse" style="animation-delay: 2.4s;" />
    <circle cx="920" cy="240" r="5" fill="#10b981" class="node-pulse" style="animation-delay: 0.9s;" />
  </g>

  <!-- Glowing Aura behind Foregound Center -->
  <circle cx="420" cy="170" r="140" fill="#00f2fe" opacity="0.08" filter="url(#glow)" />
  <circle cx="800" cy="180" r="160" fill="#a18cd1" opacity="0.06" filter="url(#glow)" />

  <!-- Top Pill / Badge -->
  <g transform="translate(80, 52)">
    <rect width="270" height="28" rx="14" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10b981" filter="url(#subtleGlow)" />
    <text x="30" y="18" fill="#e2e8f0" class="banner-pill">CURATED ECOSYSTEM &#8226; 2026 EDITION</text>
  </g>

  <!-- Foreground Main Title & Branding -->
  <g transform="translate(80, 140)">
    <text x="0" y="0" fill="url(#accentGrad)" font-size="44" class="banner-title" filter="url(#subtleGlow)">
      Awesome Biomedical Research Platforms
    </text>
    <text x="0" y="44" fill="#f1f5f9" font-size="20" class="banner-sub" opacity="0.95">
      Reproducible Genomic Workflows, Cloud Bioinformatics SaaS &amp; Open-Source Pipelines
    </text>
    <text x="0" y="76" fill="#94a3b8" font-size="14.5" class="banner-sub">
      Multi-Omics Orchestration &#8226; Next-Gen Sequencing (NGS) &#8226; Clinical Data Management &#8226; GA4GH Standards
    </text>
  </g>

  <!-- Foreground Feature Badges / Highlights -->
  <g transform="translate(80, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#00f2fe" stroke-width="1.2" />
      <text x="16" y="21" fill="#38bdf8" class="banner-pill">&#9889; CLOUD BIOINFORMATICS</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="195" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#a18cd1" stroke-width="1.2" />
      <text x="16" y="21" fill="#c084fc" class="banner-pill">&#129516; WORKFLOW ORCHESTRATION</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(405, 0)">
      <rect width="185" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#10b981" stroke-width="1.2" />
      <text x="16" y="21" fill="#34d399" class="banner-pill">&#128300; CLINICAL GENOMICS</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(605, 0)">
      <rect width="165" height="34" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.2" />
      <text x="16" y="21" fill="#fbbf24" class="banner-pill">&#128279; OPEN STANDARDS</text>
    </g>
  </g>
</svg>
